[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgviz"
version = "0.2.1"
description = "3D knowledge graph visualization for Python — Jupyter, Streamlit, Gradio, Dash, and more"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Chanin Nantasenamat" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/dataprofessor/kgviz"
Repository = "https://github.com/dataprofessor/kgviz"
Issues = "https://github.com/dataprofessor/kgviz/issues"

[project.optional-dependencies]
streamlit = ["streamlit>=1.30"]
networkx = ["networkx>=3.0"]
pandas = ["pandas>=2.0"]
jupyter = ["ipython>=8.0"]
gradio = ["gradio>=4.0"]
dash = ["dash>=2.0"]
marimo = ["marimo>=0.8"]
maps = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "minisom>=2.3",
]
all = [
    "streamlit>=1.30",
    "networkx>=3.0",
    "pandas>=2.0",
    "ipython>=8.0",
    "gradio>=4.0",
    "dash>=2.0",
    "marimo>=0.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "minisom>=2.3",
]
dev = [
    "networkx>=3.0",
    "pandas>=2.0",
    "streamlit>=1.30",
    "ipython>=8.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pytest>=7.0",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
markers = [
    "browser: Playwright browser tests (requires playwright install chromium)",
]

[tool.setuptools.packages.find]
include = ["kgviz*"]

[tool.setuptools.package-data]
kgviz = ["_viewer/build/**/*"]
